name: AE Android preview

on:
  push:
    branches: [ae]

permissions:
  contents: read

jobs:
  apk:
    if: github.repository == 'koinupapi/Atrium-Expressive'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true
      - name: Resolve workspace dependencies
        working-directory: app
        run: flutter pub get --enforce-lockfile
      - name: Generate Dart sources
        run: dart run tool/build_all.dart
      - name: Build installable Android preview
        working-directory: app
        run: flutter build apk --debug --target-platform android-arm64
      - name: Verify Android app identity and signature
        shell: bash
        run: |
          set -euo pipefail
          apk=app/build/app/outputs/flutter-apk/app-debug.apk
          sdk_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$sdk_tools/apksigner" verify "$apk"
          badging="$("$sdk_tools/aapt" dump badging "$apk")"
          grep -q "^package: name='app.atrium.ae'" <<< "$badging"
          grep -q "^application-label:'AE'$" <<< "$badging"
          cp "$apk" AE-preview.apk
      - uses: actions/upload-artifact@v4
        with:
          name: AE-preview
          path: AE-preview.apk
          if-no-files-found: error
