name: AE Android build

on:
  push:
    branches: [ae]

permissions:
  contents: read

jobs:
  apk:
    if: github.repository == 'koinupapi/Atrium-Expressive'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true
      - name: Resolve workspace dependencies
        working-directory: app
        run: flutter pub get --enforce-lockfile
      - name: Generate Dart sources
        run: dart run tool/build_all.dart
      - name: Prepare release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ATRIUM_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ATRIUM_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ATRIUM_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          echo "$KEYSTORE_BASE64" | base64 --decode > app/android/atrium-expressive.jks

          {
            echo "storeFile=atrium-expressive.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=atrium-expressive"
            echo "keyPassword=$KEY_PASSWORD"
          } > app/android/key.properties

          chmod 600 app/android/atrium-expressive.jks
          chmod 600 app/android/key.properties

      - name: Build signed Android APK
        working-directory: app
        run: flutter build apk --release --target-platform android-arm64
      - name: Verify Android app identity and signature
        shell: bash
        run: |
          set -euo pipefail
          apk=app/build/app/outputs/flutter-apk/app-release.apk
          sdk_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$sdk_tools/apksigner" verify "$apk"
          badging="$("$sdk_tools/aapt" dump badging "$apk")"
          grep -q "^package: name='app.atrium.ae'" <<< "$badging"
          grep -q "^application-label:'AE'$" <<< "$badging"
          cp "$apk" AE.apk
      - uses: actions/upload-artifact@v4
        with:
          name: AE
          path: AE.apk
          if-no-files-found: error
          retention-days: 30
      - name: Remove temporary signing files
        if: always()
        run: |
          rm -f app/android/atrium-expressive.jks
          rm -f app/android/key.properties
