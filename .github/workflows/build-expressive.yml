
name: Build Atrium Expressive

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true

      - name: Resolve dependencies
        working-directory: app
        run: |
          flutter config --no-analytics
          flutter pub get --enforce-lockfile

      - name: Generate required source files
        run: dart run tool/build_all.dart

      - name: Prepare release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ATRIUM_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ATRIUM_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ATRIUM_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          echo "$KEYSTORE_BASE64" | base64 --decode > app/android/atrium-expressive.jks

          {
            echo "storeFile=atrium-expressive.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=atrium-expressive"
            echo "keyPassword=$KEY_PASSWORD"
          } > app/android/key.properties

          chmod 600 app/android/atrium-expressive.jks
          chmod 600 app/android/key.properties

      - name: Build signed release APK
        working-directory: app
        run: flutter build apk --release

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Atrium-Expressive-Release
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7

      - name: Remove temporary signing files
        if: always()
        run: |
          rm -f app/android/atrium-expressive.jks
          rm -f app/android/key.properties
